name: Build Duitku Isteri APK

on:
  push:
    branches: [ main, master, 'enjin-*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip projek
        run: |
          ZIP="DuitkuIsteri.zip"
          [ -f "$ZIP" ] || ZIP="Duitku.zip"
          [ -f "$ZIP" ] || ZIP="$(ls *.zip | head -1)"
          echo "Guna fail: $ZIP"
          rm -rf projek && mkdir projek
          unzip -q "$ZIP" -d projek
          DIR="$(dirname "$(find projek -name settings.gradle.kts | head -1)")"
          echo "PROJ=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Ujian unit enjin kewangan
        working-directory: ${{ env.PROJ }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Simpan laporan ujian
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-ujian-${{ github.run_number }}
          path: ${{ env.PROJ }}/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build APK suami (Duitku)
        working-directory: ${{ env.PROJ }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Duitku-v2.0.${{ github.run_number }}.apk"

      # Kod sumber sama, versi isteri: com.asyraf.duitkuisteri, tiada OT/kerja (lihat app/build.gradle.kts)
      - name: Build APK isteri (Duitku Isteri)
        working-directory: ${{ env.PROJ }}
        run: |
          ./gradlew assembleRelease -Papp=isteri --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/DuitkuIsteri-v2.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Duitku-v2.0.${{ github.run_number }}
          path: |
            Duitku-v2.0.${{ github.run_number }}.apk
            DuitkuIsteri-v2.0.${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        # Release hanya dari main/master; cabang lain cuma simpan APK sebagai artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Duitku v2.0.${{ github.run_number }} (suami & isteri)
          body: |
            APK dibina automatik daripada commit ${{ github.sha }}.
            - Duitku-v2.0.${{ github.run_number }}.apk — app suami (com.asyraf.hadirku)
            - DuitkuIsteri-v2.0.${{ github.run_number }}.apk — app isteri (com.asyraf.duitkuisteri), tiada OT & kerja
          files: |
            Duitku-v2.0.${{ github.run_number }}.apk
            DuitkuIsteri-v2.0.${{ github.run_number }}.apk
