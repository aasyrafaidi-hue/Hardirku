name: Build Duitku Isteri APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip projek
        run: |
          ZIP="DuitkuIsteri.zip"
          [ -f "$ZIP" ] || ZIP="Duitku.zip"
          [ -f "$ZIP" ] || ZIP="$(ls *.zip | head -1)"
          echo "Guna fail: $ZIP"
          rm -rf projek && mkdir projek
          unzip -q "$ZIP" -d projek
          DIR="$(dirname "$(find projek -name settings.gradle.kts | head -1)")"
          echo "PROJ=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJ }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Namakan APK
        run: cp "${{ env.PROJ }}/app/build/outputs/apk/release/app-release.apk" "DuitkuIsteri-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DuitkuIsteri-v1.0.${{ github.run_number }}
          path: DuitkuIsteri-v1.0.${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Duitku Isteri v1.0.${{ github.run_number }}
          body: APK dibina automatik daripada commit ${{ github.sha }}.
          files: DuitkuIsteri-v1.0.${{ github.run_number }}.apk
